<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>심야 오락실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@400;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --phosphor:#a8ffd0; --tube:#e4ebff; --neon:#ff2d95; --alarm:#ff3b3b;
  --ink:#000; --glass:rgba(4,6,10,.58); --txt:#e9ecf4; --muted:#8d93a6;
  --hud:'Nanum Gothic Coding',ui-monospace,Menlo,monospace;
  --serif:'Nanum Myeongjo','Noto Serif KR',serif;
  --pixel:'Press Start 2P',ui-monospace,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#000}}
:root[data-theme="dark"]{--ink:#000}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--ink);color:var(--txt);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:var(--hud);-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter 3.5s ease-out}

/* 목표 표시 — 오락기 크레딧 표시줄처럼 */
#objective{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);
  transform:translate(-50%,-8px);opacity:0;transition:opacity .5s,transform .5s;
  display:flex;align-items:baseline;gap:10px;padding:8px 16px 9px;
  background:var(--glass);border:1px solid rgba(168,255,208,.35);border-radius:3px;
  font-size:15px;letter-spacing:.02em;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 6px rgba(168,255,208,.45);color:var(--phosphor)}
#objective.show{opacity:1;transform:translate(-50%,0)}
#objective .lbl{font-size:11px;color:rgba(168,255,208,.6)}
#objective.quiet{border-color:rgba(255,255,255,.12);color:#cfd3dc;text-shadow:none;background:rgba(0,0,0,.42)}
#objective.quiet .lbl{display:none}
#objective.danger{border-color:var(--alarm);color:#ffd0d0;background:rgba(40,0,0,.55);
  text-shadow:0 0 8px rgba(255,59,59,.9);font-size:18px;font-weight:700;animation:jit .12s infinite}
#objective.danger .lbl{display:none}
@keyframes jit{0%{transform:translate(-50%,0)}33%{transform:translate(calc(-50% + 1px),-1px)}66%{transform:translate(calc(-50% - 1px),1px)}}

#msg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  transform:translateX(-50%);max-width:min(560px,58vw);padding:12px 18px;
  background:rgba(0,0,0,.66);border-left:2px solid rgba(228,235,255,.5);
  font-size:15px;line-height:1.65;opacity:0;transition:opacity .35s;pointer-events:none;text-wrap:pretty}
#msg.show{opacity:1}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);
  font-size:12px;color:var(--muted);opacity:0;transition:opacity .8s;pointer-events:none;text-align:center;line-height:1.7}
#hint.show{opacity:1}

/* 조작부 */
#stickBase{position:fixed;left:calc(env(safe-area-inset-left,0px) + 34px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);
  width:124px;height:124px;border-radius:50%;border:2px solid rgba(255,255,255,.18);
  background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,.02) 70%);opacity:.75;transition:opacity .2s}
#stickBase.active{opacity:1;transition:none}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;
  transform:translate(-50%,-50%);background:rgba(228,235,255,.28);border:2px solid rgba(228,235,255,.5)}
#actBtn{position:fixed;right:calc(env(safe-area-inset-right,0px) + 34px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
  width:88px;height:88px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);
  color:#dfe3ee;font:700 14px var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  touch-action:none;cursor:pointer}
#actBtn svg{width:26px;height:26px}
#actBtn.ready{border-color:var(--phosphor);color:var(--phosphor);box-shadow:0 0 18px rgba(168,255,208,.35);animation:pulse 1.4s infinite}
#actBtn.ready.dark{border-color:rgba(255,255,255,.6);color:#fff;box-shadow:0 0 14px rgba(255,255,255,.18)}
@keyframes pulse{50%{box-shadow:0 0 4px rgba(168,255,208,.15)}}
#actBtn:focus-visible,button:focus-visible{outline:2px solid var(--phosphor);outline-offset:3px}
#prompt{position:fixed;right:calc(env(safe-area-inset-right,0px) + 30px);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);
  font-size:13px;padding:5px 10px;background:rgba(0,0,0,.55);border:1px solid rgba(168,255,208,.3);color:var(--phosphor);
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#prompt.show{opacity:1}
.hidden-ui #stickBase,.hidden-ui #actBtn,.hidden-ui #prompt{opacity:0!important;pointer-events:none}
@media (hover:hover) and (pointer:fine){#stickBase{display:none}}
@media (max-aspect-ratio:1/1){#msg{bottom:calc(env(safe-area-inset-bottom,0px) + 180px);max-width:86vw}}

#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%);opacity:.5;transition:opacity 2s}
#white{position:fixed;inset:0;pointer-events:none;background:#f4f7ff;opacity:0}
#daycard{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:0;transition:opacity 1s;z-index:3}
#daycard.show{opacity:1}
#dcDay{font:800 clamp(38px,8vw,64px)/1 var(--serif);letter-spacing:.16em;color:#efeae2;padding-left:.16em}
#dcSub{font:400 15px var(--serif);color:#9c978e;letter-spacing:.1em}
#toast{position:fixed;right:calc(env(safe-area-inset-right,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 14px);
  font-size:13px;color:#ffd23f;border:1px solid rgba(255,210,63,.45);background:rgba(20,14,0,.6);padding:6px 11px;opacity:0;transition:opacity .6s;pointer-events:none}
#toast.show{opacity:1}
#title .opt{margin-top:18px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;cursor:pointer}
#title .opt input{width:18px;height:18px;accent-color:#a8ffd0}
#studio .co2{font:400 14px var(--serif);color:#ffd23f;min-height:1em}
#red{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(120,0,0,.1),rgba(160,0,0,.75));opacity:0}
#fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none}
#story{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:var(--serif);font-size:clamp(22px,4.2vw,34px);letter-spacing:.06em;color:#eae6df;opacity:0;transition:opacity 1.1s}
#story.show{opacity:1}

/* 타이틀 */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000;z-index:5;
  padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);transition:opacity 1s}
#title.gone{opacity:0;pointer-events:none}
#title h1{margin:0;font:800 clamp(40px,9vw,76px)/1.05 var(--serif);letter-spacing:.12em;color:#f3efe8;
  text-shadow:0 0 18px rgba(255,45,149,.55),0 0 2px #fff;animation:tflick 5s infinite}
@keyframes tflick{0%,19%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.25}}
#title .sub{font:10px var(--pixel);color:var(--neon);letter-spacing:.3em;margin-bottom:30px}
#title button,.ovl button{font:700 16px var(--hud);color:#000;background:var(--tube);border:0;padding:14px 30px;border-radius:2px;cursor:pointer}
#title .note{margin-top:22px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}
#loading{font-size:12px;color:var(--muted)}

.ovl{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:6;background:#000;text-align:center}
.ovl.show{display:flex}
.ovl .big{font:clamp(20px,5vw,36px)/1.4 var(--pixel);color:var(--alarm);text-shadow:0 0 12px rgba(255,59,59,.7)}
.ovl .small{font-size:14px;color:var(--muted)}
/* 영화식 엔딩 크레딧 */
#end{justify-content:flex-start;overflow:hidden}
#roll{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:0;
  transform:translateY(100vh);font-family:var(--serif);color:#e9e5dd}
#end.rolling #roll{animation:roll 20s linear forwards}
@keyframes roll{to{transform:translateY(-100%)}}
#roll .ttl{font-weight:800;font-size:clamp(30px,6vw,48px);letter-spacing:.14em;margin:0 0 90px}
#roll .credit{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;width:min(420px,84vw);margin-bottom:46px;align-items:baseline}
#roll .role{text-align:right;font-size:14px;color:#9c978e;letter-spacing:.08em}
#roll .name{text-align:left;font-size:22px;letter-spacing:.04em}
#roll .gap{height:40vh}
#studio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;transition:opacity 2.4s;pointer-events:none}
#studio svg{width:clamp(96px,20vw,150px);height:auto}
#studio .co{font:400 15px var(--hud);letter-spacing:.32em;color:#d8d8d8;padding-left:.32em}
#end .fin{font:400 18px var(--serif);color:#bbb;opacity:0;transition:opacity 2s;margin-top:18px}
#end button{opacity:0;transition:opacity 2s}
#end.logo #studio{opacity:1;pointer-events:auto}
#end.logo #roll{opacity:0;transition:opacity .8s}
#end.last .fin,#end.last button{opacity:1}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){#title h1,#objective.danger,#actBtn.ready{animation:none}}
</style>
</head>
<body class="hidden-ui">
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="red"></div>
<div id="objective"><span class="lbl">목표</span><span id="objText"></span></div>
<div id="hint"></div>
<div id="msg"></div>
<div id="prompt"></div>
<div id="stickBase" class="ui-block"><div id="stickKnob"></div></div>
<button id="actBtn" class="ui-block" aria-label="조사">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
  조사
</button>
<div id="story"></div>
<div id="white"></div>
<div id="daycard"><div id="dcDay"></div><div id="dcSub"></div></div>
<div id="toast"></div>
<div id="fade"></div>

<div id="title">
  <h1>심야 오락실</h1>
  <div class="sub">AFTER HOURS</div>
  <button id="startBtn" disabled>불러오는 중…</button>
  <div class="note" id="note"></div>
  <label class="opt"><input type="checkbox" id="lowMotion"> 흔들림 효과 줄이기</label>
</div>
<div id="over" class="ovl">
  <div class="big">GAME OVER</div>
  <div class="small">그것에게 잡혔다.</div>
  <button id="retryBtn">다시 도망치기</button>
</div>
<div id="end" class="ovl">
  <div id="roll">
    <div class="ttl">심야 오락실</div>
    <div class="credit"><span class="role">제작</span><span class="name">최지훈</span></div>
    <div class="credit"><span class="role">기획</span><span class="name">챗지피티</span></div>
    <div class="credit"><span class="role">코딩</span><span class="name">클로드</span></div>
    <div class="credit"><span class="role">찾은 비밀</span><span class="name" id="eggCount">0 / 4</span></div>
    <div class="gap"></div>
  </div>
  <div id="studio">
    <svg viewBox="0 0 323 285" role="img" aria-label="manamiwu 로고">
      <rect width="323" height="285" fill="#000"/>
      <circle cx="90" cy="98" r="50" fill="#fff"/>
      <rect x="40" y="159" width="100" height="99" fill="#fff"/>
      <polygon points="160,47 160,258 299,258" fill="#fff"/>
    </svg>
    <div class="co">manamiwu</div>
    <div class="co2" id="allEggs"></div>
    <div class="fin">— 끝 —</div>
    <button id="againBtn">처음부터 다시 하기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async () => {
'use strict';
const $ = s => document.querySelector(s);
const isTouch = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
$('#note').innerHTML = isTouch
  ? '이어폰 착용과 가로 화면을 권장합니다<br>왼쪽 스틱으로 이동하고 오른쪽 화면을 밀어 둘러봅니다'
  : '이어폰 착용을 권장합니다<br>WASD로 이동하고 마우스를 끌어 둘러봅니다 · E로 조사합니다';

try { await Promise.race([
  Promise.all([document.fonts.load('700 30px "Nanum Gothic Coding"'), document.fonts.load('20px "Press Start 2P"')]),
  new Promise(r => setTimeout(r, 1800))]); } catch (e) {}

let seed = 20260924;
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b - a) * t;
function angDiff(a,b){ let d = b - a; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2; return d; }

/* ================= 렌더러 ================= */
const canvas = $('#c');
const R = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
R.setClearColor(0x000000);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07060b, 0.045);
const cam = new THREE.PerspectiveCamera(72, 1, 0.05, 60);
cam.rotation.order = 'YXZ';
cam.layers.enable(3);
const feedCam = new THREE.PerspectiveCamera(72, 4/3, 0.05, 40);
feedCam.layers.enable(1); feedCam.layers.enable(2);
const feedRT = new THREE.WebGLRenderTarget(320, 240, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter });
function resize(){ const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w/h; cam.fov = w/h < 1 ? 86 : 72; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ================= 충돌 ================= */
const RM = { x0:-10, x1:10, z0:-14, z1:8, h:3.2 };
const obst = [];
function addObst(minX,maxX,minZ,maxZ){ obst.push({minX,maxX,minZ,maxZ}); }
function hit(x,z,r){
  if (x < RM.x0 + r || x > RM.x1 - r || z < RM.z0 + r || z > RM.z1 - r) return true;
  for (const o of obst) if (x + r > o.minX && x - r < o.maxX && z + r > o.minZ && z - r < o.maxZ) return true;
  return false;
}
function slide(e,dx,dz,r){ const ox = e.x, oz = e.z; if (!hit(e.x + dx, e.z, r)) e.x += dx; if (!hit(e.x, e.z + dz, r)) e.z += dz; return Math.hypot(e.x - ox, e.z - oz); }

/* ================= 텍스처 ================= */
function cv(w,h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tx(c, rx, ry){ const t = new THREE.CanvasTexture(c); if (rx){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); } t.anisotropy = 4; return t; }
function grime(g,w,h,n,a){ for (let i=0;i<n;i++){ g.fillStyle = `rgba(0,0,0,${rnd()*a})`; g.fillRect(rnd()*w, rnd()*h, 1+rnd()*3, 1+rnd()*3); } }

const carpet = (() => { const c = cv(512,512), g = c.getContext('2d');
  g.fillStyle = '#0d0a1d'; g.fillRect(0,0,512,512);
  const cols = ['#ff2d95','#1fe0ff','#ffd23f','#7dff5a','#a46bff']; g.lineWidth = 3;
  for (let i=0;i<90;i++){ g.globalAlpha = .5; const col = cols[i%5]; g.strokeStyle = g.fillStyle = col;
    const x = rnd()*512, y = rnd()*512, s = 10 + rnd()*20, k = i % 4; g.beginPath();
    if (k===0) { g.arc(x,y,s*.55,0,7); g.stroke(); }
    else if (k===1) { g.moveTo(x,y); for (let j=1;j<5;j++) g.lineTo(x+j*s*.45, y+(j%2?-s*.35:s*.35)); g.stroke(); }
    else if (k===2) { g.moveTo(x,y-s*.5); g.lineTo(x+s*.5,y+s*.4); g.lineTo(x-s*.5,y+s*.4); g.closePath(); g.stroke(); }
    else { g.fillRect(x,y,5,5); g.fillRect(x+9,y+6,3,3); }
  } g.globalAlpha = 1; grime(g,512,512,5000,.35); return c; })();
const wallC = (() => { const c = cv(256,256), g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,256); gr.addColorStop(0,'#1b1424'); gr.addColorStop(1,'#241a30');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  g.fillStyle = '#120d18'; g.fillRect(0,168,256,88);
  g.fillStyle = 'rgba(255,45,149,.55)'; g.fillRect(0,162,256,5);
  g.fillStyle = 'rgba(31,224,255,.35)'; g.fillRect(0,172,256,2);
  grime(g,256,256,2500,.3);
  for (let i=0;i<6;i++){ g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(rnd()*256, 0, 2+rnd()*5, 256); }
  return c; })();
const ceilC = (() => { const c = cv(128,128), g = c.getContext('2d');
  g.fillStyle = '#2b2b31'; g.fillRect(0,0,128,128); g.strokeStyle = '#17171b'; g.lineWidth = 3; g.strokeRect(0,0,128,128);
  grime(g,128,128,500,.35); return c; })();
const matFloor = new THREE.MeshLambertMaterial({ map: tx(carpet, 5, 5.5) });
const matWallNS = new THREE.MeshLambertMaterial({ map: tx(wallC, 5, 1) });
const matWallEW = new THREE.MeshLambertMaterial({ map: tx(wallC, 5.5, 1) });
const matCeil = new THREE.MeshLambertMaterial({ map: tx(ceilC, 10, 11) });

/* ================= 방 ================= */
function mesh(geo, mat, x, y, z){ const m = new THREE.Mesh(geo, mat); m.position.set(x||0, y||0, z||0); scene.add(m); return m; }
{ const f = mesh(new THREE.PlaneGeometry(20,22,40,44), matFloor, 0,0,-3); f.rotation.x = -Math.PI/2;
  const c = mesh(new THREE.PlaneGeometry(20,22,20,22), matCeil, 0,RM.h,-3); c.rotation.x = Math.PI/2;
  mesh(new THREE.PlaneGeometry(20,3.2,40,6), matWallNS, 0,1.6,-14);
  const s = mesh(new THREE.PlaneGeometry(20,3.2,40,6), matWallNS, 0,1.6,8); s.rotation.y = Math.PI;
  const w = mesh(new THREE.PlaneGeometry(22,3.2,44,6), matWallEW, -10,1.6,-3); w.rotation.y = Math.PI/2;
  const e = mesh(new THREE.PlaneGeometry(22,3.2,44,6), matWallEW, 10,1.6,-3); e.rotation.y = -Math.PI/2; }

const amb = new THREE.AmbientLight(0x9aa0b8, 0.3); scene.add(amb);

/* 형광등 */
const fixtures = [];
{ const tubeGeo = new THREE.BoxGeometry(1.5,.05,.2), housGeo = new THREE.BoxGeometry(1.62,.06,.32);
  const housMat = new THREE.MeshLambertMaterial({ color:0x3a3a42 });
  for (const z of [5,-2.8,-8,-12.7]) for (const x of [-6,0,6]) {
    mesh(housGeo, housMat, x, 3.17, z);
    const tm = new THREE.MeshBasicMaterial({ color:0xf0f4ff });
    mesh(tubeGeo, tm, x, 3.12, z);
    const L = new THREE.PointLight(0xdfe7ff, 1.05, 13, 1.4); L.position.set(x, 2.9, z); scene.add(L);
    fixtures.push({ x, z, L, tm, lv:1, fl:0, fs:true, dying:0 });
  } }
/* 비상등 */
const emerg = [];
for (const [x,y,z] of [[-9.85,2.7,-3],[9.85,2.7,-5],[0,2.8,7.85]]) {
  const lamp = mesh(new THREE.BoxGeometry(.32,.12,.32), new THREE.MeshBasicMaterial({ color:0x301010 }), x, y, z);
  const L = new THREE.PointLight(0xff2e1c, 0, 14, 1.3); L.position.set(x*.93, y-.2, z*.97); scene.add(L);
  emerg.push({ lamp, L });
}
function setEmergency(v){ emerg.forEach(e => { e.L.intensity = v*1.5; e.lamp.material.color.set(v ? 0xff4030 : 0x301010); }); }

/* ================= 출입문 ================= */

    col *= 0.82 + 0.18 * sin(uv.y * 520.0);

  } else if (mode > 1.5 && mode < 2.5) {

function buildFlow(px,pz){
  dist.fill(-1); let [si,sj] = cellOf(px,pz);
  const q = new Int32Array(GW*GH); let h = 0, t = 0; const s = sj*GW+si; dist[s] = 0; q[t++] = s;
  while (h < t) { const c = q[h++], ci = c % GW, cj = (c - ci)/GW, d = dist[c];
    for (let dj=-1;dj<=1;dj++) for (let di=-1;di<=1;di++) { if (!di && !dj) continue;
      const ni = ci+di, nj = cj+dj; if (ni<0||nj<0||ni>=GW||nj>=GH) continue; const n = nj*GW+ni;
      if (blocked[n] || dist[n] >= 0) continue; if (di && dj && (blocked[cj*GW+ni] || blocked[nj*GW+ci])) continue;
      dist[n] = d + 1; q[t++] = n; } }
}

}

const offOrder = fixtures.filter(f => f.z < 0).sort((a,b) => a.z - b.z || a.x - b.x);

function activateBestCab(){
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw); let best = null, bs = -1e9;
  for (const c of cabs) { if (c.on || c.u.mode.value || c.special) continue;
    const dx = c.sp.x - P.x, dz = c.sp.z - P.z, d = Math.hypot(dx,dz); if (d < 2 || d > 10) continue;
    const facing = -(dx*c.nx + dz*c.nz)/d; if (facing < .3) continue;
    const view = (dx*fx + dz*fz)/d; const s = view*2 + facing - Math.abs(d - 4.5)*.25; if (s > bs) { bs = s; best = c; } }

/* 4일차 — 나타났다 사라지는 사람 */
const SPOTS = [[-9.2,-3],[-3,-2.8],[-1.5,-8],[7.5,-8],[7.8,-2.8],[-9.2,-12.8],[3,-12.9],[-1.5,2.5],[8,1.5],[-9.2,4.5],[0.3,-3],[-5,-8],[5,-2.8],[-1.5,-12.9]];
function strangerUpdate(dt){
  if (F.day !== 4 || F.phase !== 'day') return;
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw), s = F.stranger;
  if (!s) {
    F.strangerT -= dt; if (F.strangerT > 0 || F.strangerN >= 7) return;
    const cand = SPOTS.filter(([x,z]) => { const d = Math.hypot(x - P.x, z - P.z); if (d < 6.5 || d > 14) return false;
      return ((x - P.x)*fx + (z - P.z)*fz)/d > .78 && los(P.x, P.z, x, z); });
    if (!cand.length) { F.strangerT = .4; return; }
    const [x,z] = cand[Math.floor(Math.random()*cand.length)];
    strangerFig.position.set(x, 0, z); strangerFig.visible = true; F.stranger = { x, z, seen:0, away:0 }; F.strangerN++;
    strangerLight.intensity = .8; return;
  }
  const d = Math.hypot(s.x - P.x, s.z - P.z); tmpV.set(s.x, 1.3, s.z); const vis = inView(tmpV);
  strangerFig.rotation.y = Math.atan2(P.x - s.x, P.z - s.z); animCreature(strangerFig, 0, 0, T*.5);
  const tx2 = P.x - s.x, tz2 = P.z - s.z, tl = Math.hypot(tx2, tz2) || 1;
  strangerLight.position.set(s.x + tx2/tl*.6, 2.1, s.z + tz2/tl*.6);
  if (vis) s.seen += dt; else s.away += dt;
  if (d < 5 || s.seen > 1.8 || (s.seen > .2 && s.away > .4) || s.away > 6) {
    if (vis) { F.blink = .2; S.click({ x:s.x, y:3, z:s.z }); } else S.whisper({ x:s.x, y:1.6, z:s.z });
    strangerFig.visible = false; strangerLight.intensity = 0; F.stranger = null; F.strangerT = 5 + Math.random()*5;
  }
}

function freeSpot(x, z){ if (!hit(x,z,.4)) return [x,z]; for (let r=.4;r<6;r+=.4) for (let a=0;a<Math.PI*2;a+=Math.PI/8) { const nx = x + Math.cos(a)*r, nz = z + Math.sin(a)*r; if (!hit(nx,nz,.4)) return [nx,nz]; } return [x,z]; }

  exitGlowMat.color.set(0xa9c4d4); exitLight.color.set(0xcfe6ff); exitLight.intensity = 1.6; }
const bossGoal = () => F.boss >= 3 ? '비상구로 도망쳐라' : `빛나는 오락기를 켜라 ${F.boss} / 3`;

  fixtures.forEach(f => { f.lv = 0; f.fl = 0; f.dying = 0; });
  [fixtures[4], fixtures[6]].forEach(f => { f.lv = .7; f.fl = 1; });
  const bx = Math.sin(P.yaw), bz = Math.cos(P.yaw);
  const [mx, mz] = freeSpot(P.x + bx*3.3 + 1.4, P.z + bz*3.3);
  M.x = mx; M.z = mz; M.active = false; M.t = 0; M.stun = 0; M.yaw = Math.atan2(P.x - mx, P.z - mz);
  monster.visible = true; monsterLight.intensity = 1.2; placeMonster();
  S.stinger(); S.growl({ x:mx, y:2, z:mz }); F.shake = .7; redFlash(.8);
  setObjective('도망쳐라', 'danger');

  F.forceLook = { x:mx, z:mz, t:1 }; F.canMove = false;
  wait(retry ? .7 : 1.2, () => { F.canMove = true; F.forceLook = null; });

}
function bossCabAct(c){
  c.done = true; F.boss++; S.coin(); S.crt(c.sp); c.u.mode.value = 3; wait(.5, () => { c.u.mode.value = 0; });
  flashEl('#white', .75, .9); M.stun = 2.2; S.growl({ x:M.x, y:2, z:M.z }); F.shake = Math.max(F.shake, .4);
  setObjective(bossGoal(), 'danger');
  if (F.boss >= 3) wait(.6, openExit);
}
function caught(){
  F.phase = 'caught'; F.canMove = false; M.active = false; F.shake = 1.4; showUI(false);
  S.growl({ x:M.x, y:2, z:M.z }); S.stinger(); redFlash(1); F.forceLook = { x:M.x, z:M.z, t:.4 };
  wait(1.3, () => { fadeTo('#000', 1, 0); $('#over').classList.add('show'); ramp(AU.drone, 0, .3); setObjective(null); });
}
$('#retryBtn').addEventListener('click', () => { $('#over').classList.remove('show'); timers = []; F.forceLook = null; startChase(true); });
function escaped(){
  F.phase = 'escaped'; F.canMove = false; M.active = false; F.run = false; setObjective(null); showUI(false); hideMsg();
  fadeTo('#dde8ef', 1, .35); ramp(AU.drone, 0, .5); ramp(AU.master, 0, 1.2);
  wait(.6, () => fadeTo('#000', 1, .9));
  wait(2.2, () => story('탈출했다.', 3.2));
  wait(6.8, () => story('…정말로?', 3.2));
  wait(11.4, startEnding);
}
function startEnding(){
  F.day = 6; resetWorld(); F.phase = 'ending'; F.horror = false;
  P.pitch = -.05; P.eye = 1.62;
  cabs.forEach(c => { c.u.map.value = feedRT.texture; c.u.mode.value = 1; c.on = true; });
  ramp(AU.master, 1, .1); ramp(AU.hum, 1, 2); ramp(AU.buzz, 1, 2); ramp(AU.drone, .1, 4);
  F.attract = true; tuneLoop();
  fadeTo('#000', 0, 2.5); F.canMove = true; showUI(true);
  wait(8.5, finalP2);
}
function tuneLoop(){ if (!F.attract) return; S.tune(); wait(2.2, tuneLoop); }
const p2Tex = (() => { const c = cv(320,240), g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0,0,320,240);
  g.textAlign = 'center'; g.font = 'bold 30px "Press Start 2P", monospace'; g.fillStyle = '#ff4f86'; g.fillText('PLAYER 2', 160, 105);
  g.fillStyle = '#ffffff'; g.fillText('READY', 160, 155); g.fillStyle = 'rgba(255,255,255,.4)'; g.font = '10px "Press Start 2P", monospace'; g.fillText('CREDIT 01', 160, 205);
  return tx(c); })();
function finalP2(){
  F.canMove = false; showUI(false); F.attract = false;
  let best = null, bd = 1e9;
  for (const c of cabs) { const dx = P.x - c.sp.x, dz = P.z - c.sp.z, d = Math.hypot(dx,dz); if ((dx*c.nx + dz*c.nz)/d < .2) continue; if (d < bd) { bd = d; best = c; } }
  if (!best) best = cabs[0];
  best.u.map.value = p2Tex; best.u.mode.value = 2; F.p2Cab = best; F.p2 = true; F.ghostOn = true;
  S.coin(); ramp(AU.hum, 0, 3); ramp(AU.buzz, 0, 3);
  F.autoWalk = { fx:P.x, fz:P.z, tx:best.sp.x + best.nx*1.15, tz:best.sp.z + best.nz*1.15, sx:best.sp.x, sz:best.sp.z, t:0, dur:3.2 };
  wait(7, () => { fadeTo('#000', 1, 0); ramp(AU.master, 0, .05); rollCredits(); });
}
function rollCredits(){
  const e = $('#end'); e.classList.add('show');
  const n = Object.keys(F.eggs).length; $('#eggCount').textContent = `${n} / 4`;
  if (n >= 4) $('#allEggs').textContent = '모든 비밀을 찾았다. 끝까지 함께해 줘서 고마워요.';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const showLogo = () => { e.classList.add('logo'); setTimeout(() => e.classList.add('last'), 3200); };
  if (reduce) { $('#roll').style.display = 'none'; showLogo(); return; }
  setTimeout(() => e.classList.add('rolling'), 1500);
  $('#roll').addEventListener('animationend', showLogo, { once:true });
}
$('#againBtn').addEventListener('click', () => location.reload());

/* 발소리 */
const FS = { next:0, left:0, x:0, z:0 };
function updateSteps(){
  if (!F.steps || T < FS.next) return;
  if (FS.left <= 0) { const a = P.yaw + (Math.random()-.5)*1.3, d = F.retEnabled ? lerp(7.5, 3.5, F.retProg) : 8.5;
    FS.x = P.x + Math.sin(a)*d; FS.z = P.z + Math.cos(a)*d; FS.left = 3 + Math.floor(Math.random()*4); }
  S.mstep({ x:FS.x, y:0, z:FS.z }, .45); FS.left--;
  FS.x += (P.x - FS.x)*.07; FS.z += (P.z - FS.z)*.07;
  FS.next = T + (FS.left > 0 ? .62 : (F.retEnabled ? 2.4 + Math.random()*2 : 4 + Math.random()*3));
}

/* ================= 괴물 ================= */
function placeMonster(){ monster.position.set(M.x, 0, M.z); monster.rotation.y = M.yaw; monsterLight.position.set(M.x + Math.sin(M.yaw)*.7, 2.2, M.z + Math.cos(M.yaw)*.7); }
function animCreature(c, phase, amp, t){ const u = c.userData;
  u.arms[0].rotation.x = Math.sin(phase)*amp; u.arms[1].rotation.x = -Math.sin(phase)*amp;
  u.legs[0].rotation.x = -Math.sin(phase)*amp*1.1; u.legs[1].rotation.x = Math.sin(phase)*amp*1.1;
  u.head.rotation.z = Math.sin(t*1.7)*.18; u.head.rotation.x = .15 + Math.sin(t*.9)*.08; }
function updateMonster(dt){
  if (!monster.visible) return;
  if (!M.active) { animCreature(monster, T*2, .1, T); monster.position.y = Math.sin(T*3)*.02; return; }
  if (M.stun > 0) { M.stun -= dt; animCreature(monster, 0, 0, T*6); monster.userData.arms.forEach((a,i) => a.rotation.x = -2.4); monster.position.y = 0; return; }
  M.t += dt; M.spd = Math.min(4.15, 3.0 + M.t*.028);
  M.flowT -= dt; if (M.flowT <= 0) { buildFlow(P.x, P.z); M.flowT = .2; }
  let tx = P.x, tz = P.z;
  if (!los(M.x, M.z, P.x, P.z)) {
    const [ci,cj] = cellOf(M.x, M.z); let bd = dist[cj*GW+ci], bi = -1, bj = -1;
    for (let dj=-1;dj<=1;dj++) for (let di=-1;di<=1;di++) { const ni = ci+di, nj = cj+dj; if (ni<0||nj<0||ni>=GW||nj>=GH) continue;
      const v = dist[nj*GW+ni]; if (v >= 0 && (bd < 0 || v < bd)) { if (di && dj && (blocked[cj*GW+ni] || blocked[nj*GW+ci])) continue; bd = v; bi = ni; bj = nj; } }
    if (bi >= 0) { tx = RM.x0 + (bi+.5)*CS; tz = RM.z0 + (bj+.5)*CS; }
  }
  const dx = tx - M.x, dz = tz - M.z, d = Math.hypot(dx,dz) || 1;
  slide(M, dx/d*M.spd*dt, dz/d*M.spd*dt, .27);
  M.yaw += angDiff(M.yaw, Math.atan2(dx,dz))*Math.min(1, dt*8);
  M.anim += dt*M.spd*2.4; placeMonster(); monster.position.y = Math.abs(Math.sin(M.anim))*.06;
  animCreature(monster, M.anim, .7, T);
  M.stepT -= dt; if (M.stepT <= 0) { M.stepT = .3; S.mstep({ x:M.x, y:0, z:M.z }, .75); }
  const pd = Math.hypot(P.x - M.x, P.z - M.z);
  F.chaseFx -= dt; if (F.chaseFx <= 0) { F.chaseFx = clamp(pd*.11, .32, 1.1); S.heart(clamp(1.4 - pd*.1, .4, 1.2)); }
  if (pd < 3) F.shake = Math.max(F.shake, (3 - pd)*.05);
  if (pd < .85) caught();
}

/* ================= 시작 ================= */
function warmup(){ const hidden = [monster, ghost, doll, strangerFig, prizeDoll, keyMesh]; hidden.forEach(o => o.visible = true); try { R.compile(scene, cam); R.compile(scene, feedCam); } catch (e) {} hidden.forEach(o => o.visible = false); }
warmup();
if (matchMedia('(prefers-reduced-motion: reduce)').matches) $('#lowMotion').checked = true;
const startBtn = $('#startBtn'); startBtn.disabled = false; startBtn.textContent = '시작하기';
startBtn.addEventListener('click', () => {
  F.lowMotion = $('#lowMotion').checked;
  $('#title').classList.add('gone'); aInit(); F.play = true;
  startDay(1);
});

/* ================= 메인 루프 ================= */
const frustum = new THREE.Frustum(), pm = new THREE.Matrix4();
function inView(v){ pm.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse); frustum.setFromProjectionMatrix(pm); return frustum.containsPoint(v); }
const tmpV = new THREE.Vector3();
let frame = 0, feedCab = null;

function update(dt){
  T += dt; interCD -= dt;
  const due = timers.filter(t => t.t <= T); timers = timers.filter(t => t.t > T); due.forEach(t => t.fn());
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) hideMsg(); }
  if (F.phase === 'wake') { P.eye = lerp(P.eye, 1.62, dt*.9); P.pitch = lerp(P.pitch, -.03, dt*.8); }

  // 3일차 멀미
  let roll = 0;
  if (F.sick > 0) {
    F.sickPulse -= dt; if (F.sickPulse <= 0) { F.sickPulse = 9 + Math.random()*6; F.sickSurge = 1.8; tone({ f:72, f2:52, dur:1.8, g:.16, type:'sawtooth' }); }
    F.sickSurge = Math.max(0, F.sickSurge - dt);
    const k = F.sick*(1 + (F.sickSurge > 0 ? 1.4 : 0));
    roll = Math.sin(T*.7)*.05*k;
    cam.fov = baseFov() + Math.sin(T*.45)*4*k; cam.updateProjectionMatrix();
    matFloor.map.offset.set(Math.sin(T*.23)*.04*k, Math.cos(T*.19)*.04*k);
  }

  // 이동
  let moved = 0;
  if (F.canMove) {
    let mx = stick.sx + ((keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0));
    let my = stick.sy + ((keys.KeyS||keys.ArrowDown?1:0) - (keys.KeyW||keys.ArrowUp?1:0));
    if (keys.KeyQ) P.yaw += dt*2; if (keys.KeyR) P.yaw -= dt*2;
    let m = Math.hypot(mx,my); if (m < .12) { mx = my = 0; m = 0; } else if (m > 1) { mx /= m; my /= m; m = 1; }
    const spd = F.run ? 3.95 : 2.5, s = Math.sin(P.yaw), c = Math.cos(P.yaw), fw = -my;
    let st = mx; if (F.sick > 0 && m > 0) st += Math.sin(T*.5)*.35*F.sick;
    moved = slide(P, (-s*fw + c*st)*spd*dt, (-c*fw - s*st)*spd*dt, .3);
    if (moved > .001) { P.bob += moved*(F.run ? 3.1 : 3.6); P.stepT -= moved; if (P.stepT <= 0) { P.stepT = F.run ? 1.05 : .8; S.step(F.run); } }
  }
  if (F.forceLook) { const tYaw = Math.atan2(-(F.forceLook.x - P.x), -(F.forceLook.z - P.z)); P.yaw += angDiff(P.yaw, tYaw)*Math.min(1, dt*6); P.pitch = lerp(P.pitch, .12, dt*5); }
  if (F.autoWalk) { const a = F.autoWalk; a.t = Math.min(a.dur, a.t + dt); const k = a.t/a.dur, e = k*k*(3-2*k);
    P.x = lerp(a.fx, a.tx, e); P.z = lerp(a.fz, a.tz, e); P.bob += dt*2.5;
    const tYaw = Math.atan2(-(a.sx - P.x), -(a.sz - P.z)); P.yaw += angDiff(P.yaw, tYaw)*Math.min(1, dt*3);
    cam.fov = lerp(cam.fov, 46, dt*1.1); cam.updateProjectionMatrix();
    const hd = Math.hypot(a.sx - P.x, a.sz - P.z); P.pitch = lerp(P.pitch, Math.atan2(1.32 - 1.62, Math.max(.3,hd)), dt*3); }

  // 카메라
  F.shake = Math.max(0, F.shake - dt*1.2);
  const sh = F.shake*F.shake*.35;
  cam.position.set(P.x + (Math.random()-.5)*sh, P.eye + Math.sin(P.bob*2)*.035 + (Math.random()-.5)*sh, P.z + (Math.random()-.5)*sh);
  cam.rotation.set(P.pitch + (Math.random()-.5)*sh*.3 + roll*.3, P.yaw, Math.sin(P.bob)*.008 + roll + (Math.random()-.5)*sh*.4);
  cam.updateMatrixWorld(); cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
  listener();

  // 조사 대상
  curInter = F.canMove ? findInter() : null;
  const btn = $('#actBtn'), pr = $('#prompt');
  btn.classList.toggle('ready', !!curInter); btn.classList.toggle('dark', F.horror);
  if (curInter && !F.horror) { pr.textContent = curInter.label; pr.classList.add('show'); } else pr.classList.remove('show');

  // 날짜별 진행
  if (F.day === 2 && F.dollPresent && F.anomFound.doll) {
    const dd = Math.hypot(P.x - dollPos.x, P.z - dollPos.z);
    if (dd > 5 && !inView(dollPos)) hideDoll();
  }
  strangerUpdate(dt);
  if (F.retEnabled && F.phase === 'day') {
    F.retDist += moved;
    if (F.retEv < offOrder.length && F.retDist > 2.1*(F.retEv + 1)) { F.retEv++; returnEvent(F.retEv); }
    F.retProg = Math.min(1, F.retEv/8); F.ghostDist = lerp(2.7, .8, F.retProg);
  }
  if (F.phase === 'chase') {
    updateMonster(dt);
    if (exitTarget === 1 && P.z < -13.35 && P.x > -8.3 && P.x < -6.7) escaped();
    if (Math.random() < dt*.8) { const c = cabs[Math.floor(Math.random()*cabs.length)];
      if (!c.boss && !c.special) { c.u.mode.value = 3; wait(.15 + Math.random()*.2, () => { if (F.phase === 'chase') c.u.mode.value = 0; }); } }
    bossCabs.forEach(c => { if (!c.done) c.u.bright.value = (T*2 % 1) < .6 ? 1.2 : .35; });
  } else if (F.phase === 'caught') updateMonster(0);
  updateSteps();

  // 펭귄 화면
  if (penguinCab.u.mode.value === 2) { penT -= dt; if (penT <= 0) { penT = .35; drawPenguin(++penFrame); } }

  // 조명
  F.blink -= dt;
  for (const f of fixtures) {
    let v = f.lv;
    if (f.dying > 0) { f.dying -= dt; v *= Math.random() < .5 ? .05 : 1; if (f.dying <= 0) { f.lv = 0; f.fl = 0; v = 0; } }
    else if (f.fl > 0) { if (Math.random() < f.fl*dt*14) f.fs = !f.fs; if (!f.fs) v *= .04; }
    if (F.blink > 0) v = 0;
    f.L.intensity = v*1.05; f.tm.color.setScalar(.06 + Math.min(1, v)*.9);
  }
  exitOpen += (exitTarget - exitOpen)*Math.min(1, dt*2.2); exitPivot.rotation.y = -1.75*exitOpen;
  if (F.phase === 'chase' && exitLight.intensity > 1) exitLight.intensity = 1.4 + Math.sin(T*9)*.25;

  // 화면 피드와 화면 속 존재
  feedCab = null; let bs = -1e9;
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw);
  for (const c of cabs) { if (c.u.mode.value < .5) continue; c.u.time.value = T + c.x;
    if (c.u.mode.value !== 1) continue;
    const dx = c.sp.x - P.x, dz = c.sp.z - P.z, d = Math.hypot(dx,dz); if (d > 14 || -(dx*c.nx + dz*c.nz) < 0) continue;
    const s = (dx*fx + dz*fz)/d*2 - d*.12; if (s > bs) { bs = s; feedCab = c; } }
  if (F.p2Cab) F.p2Cab.u.bright.value = (T*1.6 % 1) < .62 ? 1 : .25;
  if (feedCab) {
    feedCam.position.set(feedCab.sp.x + feedCab.nx*.14, feedCab.sp.y + .05, feedCab.sp.z + feedCab.nz*.14);
    feedCam.lookAt(P.x, 1.72, P.z);
    pBody.position.set(P.x, 0, P.z); pBody.rotation.y = P.yaw + Math.PI;
    if (F.ghostOn) {
      const vx = P.x - feedCam.position.x, vz = P.z - feedCam.position.z, vl = Math.hypot(vx,vz) || 1, ux = vx/vl, uz = vz/vl;
      let gx, gz;
      if (F.p2) { gx = P.x - uz*.8 + ux*.1; gz = P.z + ux*.8 + uz*.1; }
      else { let gd = F.ghostDist, lat = .9;
        for (let k=0;k<14;k++){ gx = P.x + ux*gd - uz*lat; gz = P.z + uz*gd + ux*lat; if (!hit(gx,gz,.22)) break; if (k === 6) lat = -.9; gd = k < 6 ? Math.max(.7, gd - .3) : Math.max(.7, F.ghostDist - (k-6)*.3); } }
      ghost.visible = true; ghost.position.set(gx, 0, gz); ghost.rotation.y = Math.atan2(feedCam.position.x - gx, feedCam.position.z - gz);
      animCreature(ghost, 0, 0, T*.6);
      if (F.retEnabled) {
        const dx = feedCab.sp.x - P.x, dz = feedCab.sp.z - P.z, d = Math.hypot(dx,dz), dot = (dx*fx + dz*fz)/d;
        if (d < 4.5 && dot > .9) { F.watch += dt; if (F.watch > 1.3 && !F.watched) { F.watched = true; S.heart(.9); wait(.9, () => S.heart(1)); } }
        if (F.watched && dot < -.2) { F.watched = false; F.watch = -6; S.whisper({ x:P.x - fx*.8, y:1.6, z:P.z - fz*.8 }); }
      }
    } else ghost.visible = false;
  } else ghost.visible = false;
}

let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (F.play) update(dt);
  frame++;
  if (feedCab && frame % 2 === 0) { R.setRenderTarget(feedRT); R.render(scene, feedCam); R.setRenderTarget(null); }
  R.render(scene, cam);
}
cam.position.set(START.x, 1.62, START.z); cam.rotation.set(-.05, 0, 0);
requestAnimationFrame(loop);
})();
</script>
